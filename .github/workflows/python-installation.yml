name: Installing Python

on: [push]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest,macos-latest, windows-latest]
        py-version: ['3.10', '3.11', '3.12']
    runs-on: macos-latest

    steps:

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py-version }}

      - name: Verify Python version
        run: python --version

        
