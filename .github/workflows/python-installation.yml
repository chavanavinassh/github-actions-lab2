name: Installing Python

on: [push]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest,macos-14, windows-latest]
        py-version: ['3.10', '3.11', '3.12']
        exclude:
          - py-version: 3.12
            os : macos-14
    runs-on: macos-latest

    steps:

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.py-version }}

      - name: Verify Python version
        run: python --version

        
